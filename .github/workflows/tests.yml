name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: core.longpaths
  GIT_CONFIG_VALUE_0: 'true'

jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q agent common server tests
      - run: python scripts/validate_repo.py
      - run: python scripts/scan_personal_data.py
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = @()
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            foreach ($e in $parseErrors) { $errors += "$($_.FullName): $($e.Message)" }
          }
          if ($errors) { $errors; exit 1 }

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check shell syntax and line endings
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            bash -n "$file"
            if grep -q $'\r' "$file"; then echo "CRLF found in $file"; exit 1; fi
          done < <(find agents server -name '*.sh' -print0)

  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python scripts/package_release.py --output "$RUNNER_TEMP/homemonitor-dist"
      - run: python scripts/validate_repo.py --archives "$RUNNER_TEMP/homemonitor-dist"
